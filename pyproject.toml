[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "magicquant"
version = "0.3.0"
description = "Evolutionary Tensor Search for Optimal LLM GGUF Hybrid Quantization"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    # pydantic-settings loads .env internally, so python-dotenv is not needed.
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "tenacity>=8.2.0",
    # llama-cpp-python ships libggml-base.so + libggml-cpu.so in its wheel,
    # used by magicquant.quant.ggml_binding for all quantized encoders.
    # Discovery prefers system llama.cpp if available; falls back to this.
    "llama-cpp-python>=0.3.0",
    # gguf (llama.cpp's own pure-python package) is the canonical source of
    # ggml type name/id/block-size/type-size facts, imported at module load
    # by magicquant.quant.ggml_facts -- a hard dependency now, not just a
    # test-time convenience, so those facts are never hand-copied and left
    # to drift (see ggml_facts.py's docstring).
    # Floor raised 0.10.0 -> 0.18.0: 0.10.0's GGMLQuantizationType predates
    # the MXFP4/TQ1_0/TQ2_0 members MagicQuant dispatches/writes -- with
    # 0.10.0 installed, referencing those members either KeyErrors or (worse)
    # silently degrades to a Q4_0 fallback in the GGUF writer instead of
    # failing loudly. ggml_facts.REQUIRED_STOCK_NAMES's import-time guard
    # enforces this floor at runtime too (raises ImportError naming any
    # missing member), so an accidental pin-back is caught immediately.
    "gguf>=0.18.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
# huggingface_hub is only needed for `magicquant card --upload`.
hf = ["huggingface_hub>=0.20.0"]
# scipy and pyyaml sit in dev, not core, because each backs one optional thing:
# scipy is used by a single DIAGNOSTIC (predictor_rank_correlation's Kendall
# tau, which degrades gracefully without it) and pyyaml by the workflow-file
# guard. Their TESTS cannot degrade, so CI needs both -- without this, the
# suite is 3 red every run.
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "ruff>=0.5.0",
       "scipy>=1.10.0", "pyyaml>=6.0",
       # tools/release_check.py's tomllib fallback: CI's test matrix floor is
       # 3.10, where tomllib isn't stdlib yet (release.yml itself pins 3.12).
       "tomli>=1.2.0; python_version < '3.11'"]
# Quantization-Aware Training (QAT-LoRA). Heavy training stack — only needed for
# `magicquant qat`; the core install is unchanged. torch must be the build that
# works on this box (ROCm/CPU); install the matching wheel as appropriate.
qat = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    # transformers does not declare accelerate itself, but TrainingArguments
    # hard-requires accelerate>=1.1.0 (transformers/training_args.py
    # ACCELERATE_MIN_VERSION check). Declared explicitly here so a fresh
    # install can't legally resolve an accelerate below that floor.
    "accelerate>=1.1.0",
]

[project.scripts]
magicquant = "magicquant.__main__:main"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require a GPU (deselect with '-m \"not gpu\"')",
]

[project.urls]
Repository = "https://github.com/lucasmcoleman/MagicQuant"
Original-Research = "https://github.com/magiccodingman/MagicQuant-Wiki"

[tool.setuptools.packages.find]
where = ["."]
# tools* excluded: it's a dev-only bag of scripts (fit_noise_factors.py is
# now a thin CLI shim over magicquant.evolution.fit_noise_factors -- the
# only piece the installed package ever needed at runtime), not meant to
# install as a top-level `tools` package alongside `magicquant`.
exclude = ["docker*", "tests*", "tools*"]
