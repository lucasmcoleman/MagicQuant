name: Upstream Sync PR

# Sibling to upstream-watch.yml: that workflow tells a human "llama.cpp moved,
# go write a patch". This one drafts the mechanical half of that patch --
# arch_map lines, _HF_TO_GGUF_PATTERNS candidates, and an evidence-bearing PR
# body -- so the human's job shrinks to reviewing and checking boxes instead
# of hand-deriving everything from gguf.tensor_mapping.
#
# Never lands anything unattended: this workflow only ever opens/updates a PR
# on a rolling bot branch. Merging is explicitly a human decision -- see
# tools/draft_upstream_sync.py's module docstring and the PR body it writes
# for why (the qwen3_5 uniform-logits incident is the canonical cost of
# trusting a name-only mapping without checking it against a real model).
#
# ONE rolling branch (bot/upstream-sync), force-updated every run, feeding
# ONE PR that gets edited in place -- never a pile of stale duplicate PRs.
#
# Gate: check_upstream_drift.py's OWN exit code (1 iff newly_appeared_architectures
# is non-empty since the last accepted baseline), not a separate re-derivation
# of "is there work". draft_upstream_sync.py defaults to that same delta
# (newly_appeared_architectures) -- NEVER --full-backlog here, which targets
# the whole ~70-architecture standing backlog and is for a deliberate,
# one-time human-run clearing pass only. Running --full-backlog from this
# workflow would redraft the entire backlog every single week even when
# nothing upstream actually changed.

on:
  schedule:
    # Mondays 06:53 UTC: same day as upstream-watch.yml (17 6 * * 1), offset
    # by 36 minutes so the two jobs don't land on GitHub's scheduler in the
    # same busy on-the-hour window, and this one runs comfortably after
    # upstream-watch's own drift report would already be visible.
    - cron: "53 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "tools/check_upstream_drift.py"
      - "tools/draft_upstream_sync.py"
      - "magicquant/gguf/source.py"
      - ".github/workflows/upstream-sync-pr.yml"

permissions:
  contents: write
  pull-requests: write

env:
  BOT_BRANCH: bot/upstream-sync

jobs:
  draft-sync-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --upgrade gguf

      # This IS the gate -- has_new is true iff newly_appeared_architectures
      # is non-empty, which is exactly what draft_upstream_sync.py's default
      # (non---full-backlog) mode targets. A no-new-drift week means exit 0
      # here, and no other step in this job runs: a true no-op, not "no NEW
      # candidates but still 613 lines of standing-backlog noise".
      - name: Drift check (the gate)
        id: drift
        run: |
          set +e
          python tools/check_upstream_drift.py --json > drift.json
          echo "has_new=$?" >> "$GITHUB_OUTPUT"
          set -e

      # exit 2 (missing `gguf`, etc.) is a real failure, distinct from exit 1
      # (drift found, not an error) and exit 0 (no drift).
      - name: Fail on drift-check error
        if: steps.drift.outputs.has_new == '2'
        run: |
          echo "tools/check_upstream_drift.py errored -- see drift.json / the step above" >&2
          exit 1

      - name: Reset the rolling bot branch
        if: steps.drift.outputs.has_new == '1'
        run: |
          git config user.name "magicquant-upstream-sync[bot]"
          git config user.email "actions@github.com"
          git checkout -B "$BOT_BRANCH"

      # --apply (no --full-backlog: see the workflow-level comment above)
      # writes magicquant/gguf/source.py, writes the FULL report to
      # .github/upstream-sync-report.md (committed below -- reviewable in the
      # PR's Files Changed), and prints the SHORT PR-body summary to stdout.
      # GitHub's PR body caps at 65536 chars; the full report alone can
      # exceed that on a large draft, which is exactly why it's a committed
      # file and not the body -- draft_upstream_sync.py also hard-truncates
      # the summary defensively regardless.
      - name: Apply the draft, write the report file + PR-body summary
        if: steps.drift.outputs.has_new == '1'
        run: python tools/draft_upstream_sync.py --json drift.json --apply > pr_body.md

      - name: Commit the draft
        if: steps.drift.outputs.has_new == '1'
        run: |
          git add magicquant/gguf/source.py .github/upstream-sync-report.md
          git commit -m "bot(upstream-sync): draft arch_map + pattern candidates" \
                      -m "Auto-generated by tools/draft_upstream_sync.py from tools/check_upstream_drift.py's newly-appeared-architecture delta. Nothing here is verified against a real model checkpoint -- see .github/upstream-sync-report.md's per-architecture checklist before merging."

      - name: Run the full test suite against the draft
        if: steps.drift.outputs.has_new == '1'
        id: suite
        run: |
          set +e
          python -m pytest tests/ -q
          echo "suite_status=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Push the rolling branch (force -- it is meant to be replaced)
        if: steps.drift.outputs.has_new == '1'
        run: git push --force origin "$BOT_BRANCH"

      # Both the "open a new PR" and "update an existing PR" paths explicitly
      # set the ready/draft state every run via `gh pr ready` -- `gh pr edit`
      # alone never touches it, so a PR that was created green and later goes
      # red on a subsequent draft would otherwise stay sitting there
      # ready-to-merge. Every run re-asserts the correct state in both
      # directions (ready -> draft on red, draft -> ready on green).
      - name: Open or update the PR
        if: steps.drift.outputs.has_new == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE_STATUS: ${{ steps.suite.outputs.suite_status }}
        run: |
          TITLE="Upstream sync: draft arch_map + pattern candidates"
          if [ "$SUITE_STATUS" = "0" ]; then
            STATUS_NOTE="Full test suite: **passing** against this draft."
          else
            STATUS_NOTE="Full test suite: **FAILING** (exit $SUITE_STATUS) against this draft -- kept as a draft PR; do not merge until this is green or the failing candidates are removed."
          fi
          { echo "$STATUS_NOTE"; echo; cat pr_body.md; } > pr_body_final.md

          EXISTING=$(gh pr list --state open --head "$BOT_BRANCH" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file pr_body_final.md
            PR_NUM="$EXISTING"
            echo "updated existing PR #$EXISTING"
          else
            gh pr create --title "$TITLE" --body-file pr_body_final.md --head "$BOT_BRANCH" --draft \
              --label upstream 2>/dev/null \
              || gh pr create --title "$TITLE" --body-file pr_body_final.md --head "$BOT_BRANCH" --draft
            PR_NUM=$(gh pr list --state open --head "$BOT_BRANCH" --json number --jq '.[0].number')
          fi

          if [ "$SUITE_STATUS" = "0" ]; then
            gh pr ready "$PR_NUM"
          else
            gh pr ready "$PR_NUM" --undo
          fi

      - name: Nothing to draft
        if: steps.drift.outputs.has_new == '0'
        run: echo "no new architectures since the last accepted baseline -- true no-op"
